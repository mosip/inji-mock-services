# Email Configuration
mosip.kernel.notification.email.enabled=true
mosip.kernel.notification.email.smtp.host=smtp.gmail.com
mosip.kernel.notification.email.smtp.port=587
mosip.kernel.notification.email.smtp.username=your-email@gmail.com
mosip.kernel.notification.email.smtp.password=your-app-password
mosip.kernel.notification.email.smtp.auth=true
mosip.kernel.notification.email.smtp.starttls.enable=true
mosip.kernel.notification.email.from=noreply@truckpass.com
mosip.kernel.notification.email.from.name=TruckPass Registration System

# Email Templates
mosip.kernel.notification.email.driver.registration.subject=Driver Registration Successful - TruckPass
mosip.kernel.notification.email.admin.notification.enabled=true
mosip.kernel.notification.email.admin.email=admin@truckpass.com
